# When the fund must receive the contribution (checked 2026-09-29).
# Earnings paid before payday_super_from: by the quarter's due date below, keyed
# by quarter-end month; a weekend or public holiday moves it to the next
# business day.
# https://www.ato.gov.au/businesses-and-organisations/super-for-employers/quarterly-super-to-30-june-2026/paying-super-contributions/super-payment-due-dates
# Earnings paid from payday_super_from (Payday Super): within
# usual_period_business_days business days after the payday, the usual period
# in Superannuation Guarantee (Administration) Act 1992, s 6(1).
# https://www.ato.gov.au/businesses-and-organisations/super-for-employers/paying-super-on-payday/payment-deadlines-for-payday-super
quarterly_due:
  "09": { month: 10, day: 28 }
  "12": { month: 1, day: 28 }
  "03": { month: 4, day: 28 }
  "06": { month: 7, day: 28 }
payday_super_from: 2026-07-01
usual_period_business_days: 7
