# scheduled increases as at 2026-08-20). Pending cross-check against
# subagent source pull; see tests for schedule invariants.
# The maintainer verified this table to the date below. A lookup after it
# raises until the sources are re-checked and the date is moved.
reviewed_until: 2027-06-30
