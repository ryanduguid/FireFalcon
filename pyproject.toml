[project]
name = "au-fpa-pack"
version = "0.1.2"
description = "Australian FP&A pack on openfpa: 30 June years, Xero AU, GST/BAS. Upstream is Jeff Brines / Guiderail."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Guiderail" }]
keywords = ["fpa", "cfo", "finance", "forecasting", "cash-flow", "fp&a", "netsuite", "quickbooks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    # pandas.read_html needs an HTML parser; examples/foxfactory/pull_edgar.py
    # parses the SEC segment footnote with it.
    "lxml>=6.1.0",
    "build>=1.6.0",
    # release-python builds without isolation, so the backend comes from this
    # locked extra, pinned exactly as [build-system] requires.
    "setuptools==84.0.0",
    "formulas>=1.3.0",
    # The Payday Super business-day calendar the super guarantee due-date tests
    # run against; the package itself takes any calendar with the same methods.
    "payday-super-checker>=0.1.8",
    "coverage==7.16.1",
    "diff-cover==10.6.0",
    "ruff==0.16.9",
    "mypy==2.3.1",
    "types-PyYAML==6.0.12.20260906",
]

[project.scripts]
openfpa = "pyfpa.cli:main"

[project.urls]
Homepage = "https://github.com/ryanduguid/au-fpa-pack"
Repository = "https://github.com/ryanduguid/au-fpa-pack"
Upstream = "https://github.com/JeffBrines/openfpa"

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pyfpa*"]

[tool.setuptools.package-data]
"pyfpa" = ["py.typed"]
"pyfpa.io" = ["fixtures/*.csv"]
"pyfpa.au" = ["data/*.yaml", "fixtures/*.json"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Pin the selection instead of inheriting it: pycodestyle errors, Pyflakes and
# import sorting. Today this is ruff's default set plus "I", but stating it
# means a ruff release cannot quietly add or drop a rule from the merge gate.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# E402: these runners and their tests put the example or repository directory on
# sys.path before importing the modules underneath it, so the imports cannot
# move above that bootstrap. The kernel in pyfpa/ has no E402 exemption.
"examples/*/run_*.py" = ["E402"]
"examples/ridgeline/run_demo.py" = ["E402"]
"scripts/au_drivers_snapshot.py" = ["E402"]
"tests/test_au_drivers.py" = ["E402"]
"tests/test_harbour_light.py" = ["E402"]
# E731: the generated Lumbridge exporter binds 3 short formula builders per
# month, each capturing the loop variables as default arguments. Named
# functions would move that capture away from where it is read.
"examples/lumbridge-services/models/generated/lumbridge.py" = ["E731"]
# BLE001: the CLI and doctor boundaries deliberately turn any failure into a
# structured JSON result instead of a traceback, which is what a blind
# `except Exception` is for. Everywhere else the rule stays on.
"pyfpa/cli.py" = ["BLE001"]
"pyfpa/cli_commands/*.py" = ["BLE001"]
"pyfpa/memory/diagnostics.py" = ["BLE001"]

[tool.mypy]
files = ["pyfpa", "tests"]
python_version = "3.12"
strict = true
# `tests/` carries no __init__.py, so name its modules from the repo root and
# the `tests.*` override below can address them.
mypy_path = "."
explicit_package_bases = true

# Tests are type-checked, but not held to the annotation rules strict imposes on
# the kernel: a test body's types come from the package it exercises, and
# annotating every fixture and assertion helper buys nothing.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_any_generics = false
warn_return_any = false

# Third-party packages that ship no type information.
[[tool.mypy.overrides]]
module = ["formulas.*", "openpyxl.*", "pandas.*"]
ignore_missing_imports = true

# Example and script modules the tests import through sys.path. They sit outside
# the checked package, so mypy cannot resolve them from `files` above.
[[tool.mypy.overrides]]
module = [
    "arb_model",
    "au_drivers_snapshot",
    "foxf_model",
    "harbour_model",
    "models.generated.*",
    "pull_edgar",
    "run_arb",
    "run_foxf",
    "run_harbour",
]
ignore_missing_imports = true
