[project]
name = "firefalcon"
version = "0.1.0"
description = "Australian FP&A pack on openfpa: 30 June years, Xero AU, GST/BAS. Upstream is Jeff Brines / Guiderail."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Guiderail" }]
keywords = ["fpa", "cfo", "finance", "forecasting", "cash-flow", "fp&a", "netsuite", "quickbooks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "pandas>=2.2.3",
    "pydantic>=2.13.5",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "build>=1.6.0",
    "formulas>=1.2.7",
    "coverage==7.16.0",
    "diff-cover==10.5.1",
]

[project.scripts]
openfpa = "pyfpa.cli:main"

[project.urls]
Homepage = "https://github.com/ryanduguid/FireFalcon"
Repository = "https://github.com/ryanduguid/FireFalcon"
Upstream = "https://github.com/JeffBrines/openfpa"

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pyfpa*"]

[tool.setuptools.package-data]
"pyfpa" = ["py.typed"]
"pyfpa.io" = ["fixtures/*.csv"]
"pyfpa.au" = ["data/*.yaml"]
